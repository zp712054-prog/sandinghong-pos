<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三鼎紅｜簡易餐飲 POS V3</title>
<style>
:root{--red:#a9151b;--red2:#c62a31;--cream:#fff7eb;--line:#ead8c5;--text:#33251d;--muted:#7d6b5d;--gold:#d89a35;--green:#2d8060}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:#f4eee6;color:var(--text)}
button{font:inherit;border:0;cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}
.top{background:linear-gradient(135deg,#941017,#bd2028);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;font-size:21px}.sub{font-size:12px;opacity:.8}.top-actions{display:flex;gap:8px}.top button{background:#fff;color:var(--red);border-radius:10px;padding:9px 14px;font-weight:800}
.main{display:grid;grid-template-columns:92px minmax(420px,1fr) minmax(320px,38%);gap:10px;padding:10px;flex:1;min-height:0}
.nav{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:7px}
.nav button{background:#fff7ee;border:1px solid #efd9bf;border-radius:11px;padding:11px 4px;font-weight:800;color:#684b39}.nav button.active{background:var(--red);color:white;border-color:var(--red)}
.content,.order{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}.content{padding:12px}.order{display:flex;flex-direction:column;min-width:0}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}.section-title h2{font-size:18px;margin:0}.pill{font-size:12px;background:#f8e6d2;padding:5px 9px;border-radius:99px;color:#805b42}
.cards{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:9px}.card{background:var(--cream);border:1px solid var(--line);border-radius:13px;padding:12px;min-height:86px;text-align:left}.card strong{display:block;font-size:17px;margin-bottom:5px}.price{color:var(--red);font-size:18px;font-weight:900}.hint{font-size:11px;color:var(--muted);line-height:1.45}
.order-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.order-head h2{margin:0;font-size:18px}.order-body{padding:10px 12px;overflow:auto;flex:1}.empty{color:#9a8879;text-align:center;padding:45px 10px}.item{border-bottom:1px dashed #decbb7;padding:10px 2px}.item-main{display:flex;justify-content:space-between;gap:8px}.item-name{font-weight:800}.item-sub{font-size:11px;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:6px;margin-top:7px}.qty button{width:30px;height:30px;border-radius:8px;background:#f0e2d2;font-weight:900}.qty span{min-width:22px;text-align:center;font-weight:800}.order-foot{border-top:1px solid var(--line);padding:12px}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:900;margin-bottom:9px}.primary{width:100%;background:var(--red);color:#fff;padding:13px;border-radius:11px;font-weight:900;font-size:17px}.secondary{background:#f1e5d8;color:#674a37;padding:9px 12px;border-radius:9px;font-weight:800}
.tables{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.table-card{padding:16px 10px;border-radius:13px;background:#f5efe8;border:2px solid #e5d8ca;text-align:left}.table-card.busy{border-color:var(--red);background:#fff0ef}.table-card strong{font-size:18px}.table-card small{display:block;color:var(--muted);margin-top:5px}
.dashboard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--cream);border:1px solid var(--line);border-radius:13px;padding:14px}.stat small{color:var(--muted)}.stat b{display:block;font-size:25px;color:var(--red);margin-top:5px}.report-box{margin-top:10px;border:1px solid var(--line);border-radius:13px;padding:12px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #e1d1c0}.row:last-child{border-bottom:0}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.admin-card{border:1px solid var(--line);border-radius:13px;padding:12px}.admin-row{display:grid;grid-template-columns:1fr 90px 70px;gap:7px;align-items:center;padding:7px 0;border-bottom:1px dashed #e1d1c0}.admin-row input{width:100%;padding:7px;border:1px solid #dbc8b5;border-radius:7px}.tag{font-size:11px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(35,20,10,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:16px}.modal h2{margin:0 0 12px}.opt-group{margin:12px 0}.opt-group h3{font-size:14px;margin:0 0 7px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.opt{border:1px solid #decbb7;background:#fffaf4;border-radius:9px;padding:9px;text-align:left}.opt.selected{background:#fbe4e3;border-color:var(--red);color:var(--red);font-weight:900}.modal-actions{display:flex;gap:8px;margin-top:15px}.modal-actions button{flex:1}.note{width:100%;padding:9px;border:1px solid #dbc8b5;border-radius:8px;min-height:70px}
@media(max-width:900px){.main{grid-template-columns:76px 1fr}.order{position:fixed;right:10px;bottom:10px;left:86px;height:42vh;z-index:5;box-shadow:0 8px 30px #0002}.cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.main{grid-template-columns:1fr}.nav{flex-direction:row;overflow:auto}.nav button{min-width:74px}.order{position:relative;left:auto;right:auto;bottom:auto;height:45vh}.cards{grid-template-columns:repeat(2,1fr)}.tables{grid-template-columns:repeat(2,1fr)}.dashboard{grid-template-columns:1fr 1fr}.admin-grid{grid-template-columns:1fr}}

.workflow{display:flex;gap:5px;overflow:auto;margin-bottom:10px}
.workflow span{padding:6px 9px;border-radius:99px;background:#f1e5d8;color:#75553e;font-size:12px;white-space:nowrap}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.field label{display:block;font-size:12px;color:#766355;margin-bottom:4px}.field input,.field select{width:100%;padding:10px;border:1px solid #dbc8b5;border-radius:9px;background:#fff}
.big-choice{padding:14px;border:2px solid #ead7c3;border-radius:12px;background:#fffaf4;text-align:left}.big-choice.selected{border-color:#a9151b;background:#fff0ef;color:#a9151b}
.order-type{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kitchen-card{border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px;background:#fff}.kitchen-card.pending{border-left:6px solid var(--red)}.kitchen-card .kh{display:flex;justify-content:space-between;gap:8px}.status{font-size:11px;padding:4px 7px;border-radius:99px;background:#f8e6d2}.status.red{background:#fde1e0;color:#9d1118}.status.green{background:#e2f2eb;color:#216a4e}.smallbtn{padding:7px 9px;border-radius:8px;background:#f1e5d8;color:#674a37;font-weight:800}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">三鼎紅｜簡易餐飲 POS V3</div><div class="sub">外帶優先・預訂管理・先結帳再製作（V3 原型）</div></div><div class="top-actions"><button onclick="showPage('tables')">桌況</button><button onclick="showPage('dashboard')">營收</button></div></header>
<div class="main">
<nav class="nav">
<button id="nav-menu" onclick="showPage('menu')">點餐</button>
<button id="nav-orders" onclick="showPage('orders')">訂單</button>
<button id="nav-tables" onclick="showPage('tables')">3桌內用</button>
<button id="nav-dashboard" onclick="showPage('dashboard')">報表</button>
<button id="nav-admin" onclick="showPage('admin')">商品</button>
</nav>
<section class="content" id="content"></section>
<section class="order">
<div class="order-head"><h2 id="orderTitle">A01 桌</h2><button class="secondary" onclick="clearOrder()">清空</button></div>
<div class="order-body" id="orderBody"></div>
<div class="order-foot"><div class="total"><span>目前金額</span><span id="orderTotal">$0</span></div><button class="primary" onclick="checkout()">結帳</button></div>
</section>
</div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<script>
const baseProducts=[
{id:'pure',cat:'鍋類',name:'純粹鍋',price:70,config:'pot'},
{id:'old',cat:'鍋類',name:'懷舊鍋',price:80,config:'pot'},
{id:'budget',cat:'鍋類',name:'小資鍋',price:80,config:'pot'},
{id:'classic',cat:'鍋類',name:'經典鍋',price:90,config:'pot'},
{id:'deluxe',cat:'鍋類',name:'豪華鍋',price:110,config:'pot'},
{id:'yaki',cat:'鍋類',name:'日式鍋燒',price:80,config:'yaki'},
{id:'a',cat:'套餐',name:'A套餐',price:60,config:'setA'},
{id:'b',cat:'套餐',name:'B套餐',price:70,config:'setB'},
{id:'blood3',cat:'鍋底加料',name:'鴨血 3塊',price:15},
{id:'blood6',cat:'鍋底加料',name:'鴨血 6塊',price:25},
{id:'tofu1',cat:'鍋底加料',name:'臭豆腐 1塊',price:15},
{id:'tofu2',cat:'鍋底加料',name:'臭豆腐 2塊',price:25},
{id:'bt',cat:'鍋底加料',name:'鴨血3塊＋臭豆腐1塊',price:25},
{id:'rice',cat:'主食',name:'白飯',price:20},{id:'instant',cat:'主食',name:'泡麵',price:20},{id:'dongfen',cat:'主食',name:'冬粉',price:20},{id:'yakiN',cat:'主食',name:'鍋燒意麵',price:20},{id:'chickenN',cat:'主食',name:'雞絲麵',price:20},{id:'knifeN',cat:'主食',name:'刀削麵',price:30},{id:'udon',cat:'主食',name:'烏龍麵',price:40},
{id:'drink1',cat:'飲料',name:'古早味紅茶',price:20},{id:'drink2',cat:'飲料',name:'古早味冬瓜茶',price:20},{id:'drink3',cat:'飲料',name:'冰釀烏梅汁',price:40}
];
const ingredientNames=['大豆皮','角螺豆皮','松花皮蛋','時蔬','豆芽菜','金針菇','米血（4塊）','小甜條（6條）','老油條（小份）','鴨肉丸（4顆）','豬肉片（3片）','豬大腸（6塊）','芋頭貢丸（2顆）','黃金魚蛋（3顆）'];
ingredientNames.forEach((n,i)=>baseProducts.push({id:'ing'+i,cat:'火鍋料',name:n,price:25}));
function storageGet(key, fallback=null){
  try { return localStorage.getItem(key); } catch(e) { return fallback; }
}
function storageSet(key, value){
  try { localStorage.setItem(key, value); } catch(e) {}
}
function readJSON(key, fallback){
  try {
    const raw = storageGet(key, null);
    return raw ? JSON.parse(raw) : fallback;
  } catch(e) { return fallback; }
}

let products=readJSON('tdh_products',null)||baseProducts;
let tables=readJSON('tdh_tables',null)||Object.fromEntries(['A01','A02','A03'].map(x=>[x,[]]));
['A01','A02','A03'].forEach(x=>{if(!tables[x])tables[x]=[]});
let sales=readJSON('tdh_sales',[]);
let currentTable='外帶', currentCat='鍋類';
let nextOrderNo=Number(storageGet('tdh_nextOrderNo','1'))||1;
if(!tables[currentTable]) tables[currentTable]=[];

function save(){
  storageSet('tdh_products',JSON.stringify(products));
  storageSet('tdh_tables',JSON.stringify(tables));
  storageSet('tdh_sales',JSON.stringify(sales));
  storageSet('tdh_nextOrderNo',String(nextOrderNo));
}
function money(n){return '$'+Math.round(n).toLocaleString()}
function orderTotal(){return (tables[currentTable]||[]).reduce((s,x)=>s+x.price*x.qty,0)}
function renderOrder(){document.getElementById('orderTitle').textContent=currentTable+' 桌';let body=document.getElementById('orderBody');let arr=tables[currentTable]||[];if(!arr.length){body.innerHTML='<div class="empty">尚未點餐<br>請從左側「點餐」開始</div>'}else body.innerHTML=arr.map((x,i)=>`<div class="item"><div class="item-main"><div><div class="item-name">${x.name}</div><div class="item-sub">${x.detail||''}</div></div><b>${money(x.price*x.qty)}</b></div><div class="qty"><button onclick="changeQty(${i},-1)">−</button><span>${x.qty}</span><button onclick="changeQty(${i},1)">＋</button><button class="secondary" style="margin-left:auto" onclick="removeItem(${i})">刪除</button></div></div>`).join('');document.getElementById('orderTotal').textContent=money(orderTotal());save()}
function changeQty(i,d){tables[currentTable][i].qty+=d;if(tables[currentTable][i].qty<=0)tables[currentTable].splice(i,1);renderOrder();if(document.getElementById('content').dataset.page==='tables')renderTables()}
function removeItem(i){tables[currentTable].splice(i,1);renderOrder();renderTables()}
function clearOrder(){if(confirm('確定清空 '+currentTable+' 的未結帳訂單？')){tables[currentTable]=[];renderOrder();renderTables()}}
function showPage(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let el=document.getElementById('nav-'+page);if(el)el.classList.add('active');let c=document.getElementById('content');c.dataset.page=page;if(page==='tables')renderTables();if(page==='menu')renderMenu();if(page==='orders')renderOrders();if(page==='dashboard')renderDashboard();if(page==='admin')renderAdmin()}
function renderTables(){
  let c=document.getElementById('content');
  let dine=['A01','A02','A03'];
  c.innerHTML=`<div class="section-title"><h2>內用 3 桌</h2><span class="pill">內用也是先結帳再製作</span></div>
  <div class="tables">${dine.map(id=>{let o=tables[id]||[];return `<button class="table-card ${o.length?'busy':''}" onclick="selectTable('${id}')"><strong>${id}</strong><small>${o.length?money(o.reduce((s,x)=>s+x.price*x.qty,0)):'空桌'}</small></button>`}).join('')}</div>
  <div class="report-box"><h3>工作方式</h3><div class="hint">外帶為主；內用只有3桌。所有訂單都先確認、收款，再進入「待製作」。預訂單則依預計取餐／配送時間進入待製作。</div>
  <button class="primary" style="margin-top:10px" onclick="newTakeout()">＋ 新增外帶訂單</button></div>`;
}
function newTakeout(){
  currentTable='外帶#'+String(nextOrderNo).padStart(3,'0');
  tables[currentTable]=[];
  renderOrder(); showPage('menu');
}
function newReservation(){
  currentTable='預訂#'+String(nextOrderNo).padStart(3,'0');
  tables[currentTable]=[];
  renderOrder(); showPage('menu');
}
function selectTable(id){
  if(!tables[id])tables[id]=[];
  currentTable=id; renderOrder(); showPage('menu');
}
function orderCard(s){
  const time=s.pickupTs?new Date(s.pickupTs).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'立即製作';
  const info=[s.serviceType,s.customerName,s.phone,s.address].filter(Boolean).join('｜');
  let actions='';
  if(s.status==='預訂') actions=`<button class="smallbtn" onclick="activateReservation(${s.id})">轉入待製作</button> <button class="smallbtn" onclick="editSale(${s.id})">修改</button>`;
  if(s.status==='待製作') actions=`<button class="smallbtn" onclick="startMaking(${s.id})">開始製作</button>`;
  if(s.status==='製作中') actions=`<button class="smallbtn" onclick="markDone(${s.id})">完成出餐</button>`;
  return `<div class="kitchen-card ${s.status==='待製作'||s.status==='製作中'?'pending':''}">
    <div class="kh"><div><b>${s.orderNo||s.table}</b>　${money(s.total)}</div><span class="status ${s.status==='完成'?'green':'red'}">${s.status}</span></div>
    <div class="hint">${time}${info?'　'+info:''}</div>
    <div class="hint" style="margin-top:5px">${s.items.map(x=>x.name+' ×'+x.qty+(x.detail?'（'+x.detail+'）':'')).join('<br>')}</div>
    <div style="margin-top:8px">${actions}</div>
  </div>`;
}
function renderOrders(){
  promoteDueReservations();
  const c=document.getElementById('content');
  const pending=sales.filter(s=>s.status==='待製作'||s.status==='製作中').slice().sort((a,b)=>(a.readyAt||a.id)-(b.readyAt||b.id));
  const res=sales.filter(s=>s.status==='預訂').slice().sort((a,b)=>(a.pickupTs||Infinity)-(b.pickupTs||Infinity));
  const done=sales.filter(s=>s.status==='完成').slice(-12).reverse();
  c.innerHTML=`<div class="section-title"><h2>訂單管理</h2><span class="pill">先收款，再製作</span></div>
  <div class="order-type">
    <button class="big-choice" onclick="newTakeout()"><b>＋ 現場外帶</b><div class="hint">點餐 → 收款 → 待製作</div></button>
    <button class="big-choice" onclick="newReservation()"><b>＋ 預訂單</b><div class="hint">自取／外送，可指定時間</div></button>
  </div>
  <div class="workflow"><span class="on">🟡 待製作 ${pending.length}</span><span>📅 預訂 ${res.length}</span><span>🟢 已完成 ${done.length}</span></div>
  <h3>待製作</h3>${pending.length?pending.map(orderCard).join(''):'<div class="empty">目前沒有待製作訂單</div>'}
  <h3>預訂</h3>${res.length?res.map(orderCard).join(''):'<div class="empty">目前沒有預訂單</div>'}
  <h3>最近完成</h3>${done.length?done.map(orderCard).join(''):'<div class="empty">尚無完成訂單</div>'}`;
}
function activateReservation(id){
  const s=sales.find(x=>x.id===id); if(!s)return;
  s.status='待製作'; s.readyAt=Date.now(); save(); renderOrders();
}
function startMaking(id){
  const s=sales.find(x=>x.id===id); if(!s)return;
  s.status='製作中'; save(); renderOrders();
}
function editSale(id){
  const s=sales.find(x=>x.id===id); if(!s)return;
  currentTable=s.orderNo||s.table; tables[currentTable]=JSON.parse(JSON.stringify(s.items||[]));
  sales=sales.filter(x=>x.id!==id); save(); renderOrder(); showPage('menu');
}
function promoteDueReservations(){
  const now=Date.now(), lead=5*60*1000;
  let changed=false;
  sales.forEach(s=>{if(s.status==='預訂'&&s.pickupTs&&s.pickupTs-lead<=now){s.status='待製作';s.readyAt=now;changed=true}});
  if(changed)save();
}
setInterval(()=>{promoteDueReservations();if(document.getElementById('content')?.dataset.page==='orders')renderOrders()},30000);

function renderMenu(){let c=document.getElementById('content');let cats=['鍋類','套餐','鍋底加料','火鍋料','主食','飲料'];c.innerHTML=`<div class="section-title"><h2>點餐</h2><span class="pill">目前：${currentTable}</span></div><div style="display:flex;gap:6px;overflow:auto;margin-bottom:10px">${cats.map(cat=>`<button class="secondary" onclick="setCat('${cat}')">${cat}</button>`).join('')}</div><div class="cards">${products.filter(p=>p.cat===currentCat&&!p.disabled).map(p=>`<button class="card" onclick="addProduct('${p.id}')"><strong>${p.name}</strong><span class="price">${money(p.price)}</span>${p.config?'<div class="hint" style="margin-top:5px">需選擇內容</div>':''}</button>`).join('')}</div>`}
function setCat(cat){currentCat=cat;renderMenu()}
function addProduct(id){
  let p=products.find(x=>x.id===id);
  if(p.config){openConfig(p);return}
  let found=tables[currentTable].find(x=>x.id===p.id&&!x.detail);
  if(found)found.qty++;else tables[currentTable].push({id:p.id,name:p.name,price:p.price,qty:1});
  renderOrder();renderMenu();
}
function openConfig(p){
  let modal=document.getElementById('modal');
  let isPot=p.config==='pot';
  let html=`<h2>${p.name} <span class="price">${money(p.price)}</span></h2>`;
  if(isPot){
    html+=`<div class="opt-group"><h3>① 選幾號 <span class="hint">預設3號</span></h3>
    <div class="opts">${['1號','2號','3號','4號','5號'].map((x,i)=>`<button class="opt ${i===2?'selected':''}" data-group="no" onclick="choose(this)">${x}</button>`).join('')}</div></div>
    <div class="opt-group"><h3>② 不吃哪些配菜 <span class="hint">預設無特殊要求</span></h3>
    <div class="opts"><button class="opt selected" data-group="omit" onclick="choose(this)">無特殊要求</button><button class="opt" data-group="omit" onclick="choose(this)">不吃部分配菜</button></div>
    <div id="omitHint" class="hint" style="margin-top:6px">若選「不吃部分配菜」，可在備註欄寫明。</div></div>
    <div class="opt-group"><h3>③ 湯底 <span class="hint">預設麻辣原湯</span></h3>
    <div class="opts">${['麻辣原湯','日式柴魚（不辣）','麻辣奶香（+$10）','麻辣沙茶（+$10）'].map((x,i)=>`<button class="opt ${i===0?'selected':''}" data-group="soup" onclick="choose(this)">${x}</button>`).join('')}</div></div>
    <div class="opt-group"><h3>④ 辣度 <span class="hint">預設微辣</span></h3>
    <div class="opts">${['微微辣','微辣','小辣','中辣','大辣'].map((x,i)=>`<button class="opt ${i===1?'selected':''}" data-group="spicy" onclick="choose(this)">${x}</button>`).join('')}</div></div>`;
  }else{
    html+=`<div class="opt-group"><h3>① 主食</h3><div class="opts">${['鍋燒意麵','雞絲麵','泡麵','冬粉','刀削麵（+$10）','烏龍麵（+$20）'].map((x,i)=>`<button class="opt ${i===0?'selected':''}" data-group="main" onclick="choose(this)">${x}</button>`).join('')}</div></div>
    <div class="opt-group"><h3>② 配料</h3><div class="opts"><button class="opt selected" data-group="omit" onclick="choose(this)">無特殊要求</button><button class="opt" data-group="omit" onclick="choose(this)">不吃部分配料</button></div></div>`;
  }
  html+=`<div class="opt-group"><h3>${isPot?'⑤⑥⑦':'③'} 其他加點／備註</h3><div class="hint">套餐、主食、火鍋料、飲料等，有需要再回到分類點選。</div><textarea id="note" class="note" placeholder="例如：不要豆芽菜、不要蔥、外送備註..."></textarea></div>
  <div class="modal-actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" onclick="confirmConfig('${p.id}')">加入訂單</button></div>`;
  modal.innerHTML=html;document.getElementById('overlay').style.display='flex';
}
function choose(el){document.querySelectorAll(`[data-group="${el.dataset.group}"]`).forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function selected(group){let x=document.querySelector(`[data-group="${group}"].selected`);return x?x.textContent:''}
function confirmConfig(id){
  let p=products.find(x=>x.id===id), detail=[];
  if(p.config==='pot'){
    detail=[selected('no'),selected('omit'),selected('soup'),selected('spicy')].join('｜');
  }else{
    detail=[selected('main'),selected('omit')].join('｜');
  }
  let note=document.getElementById('note').value.trim(); if(note)detail+='｜備註：'+note;
  let price=p.price;
  if(detail.includes('麻辣奶香')||detail.includes('麻辣沙茶'))price+=10;
  if(detail.includes('刀削麵'))price+=10;
  if(detail.includes('烏龍麵'))price+=20;
  tables[currentTable].push({id:p.id+'_'+Date.now(),baseId:p.id,name:p.name,price,qty:1,detail});
  closeModal();renderOrder();renderMenu();
}
function closeModal(){document.getElementById('overlay').style.display='none'}
function toggleAddress(){
  const service=selected('service');
  const f=document.getElementById('addressField');
  if(f)f.style.display=service==='外送'?'block':'none';
}
function checkout(){
  let arr=tables[currentTable]||[];
  if(!arr.length){alert('目前沒有餐點');return}
  let total=orderTotal(), isRes=currentTable.startsWith('預訂#');
  let modal=document.getElementById('modal');
  modal.innerHTML=`<h2>${isRes?'預訂單資料確認':'先結帳，再製作'}</h2>
  <div class="report-box"><div><b>${currentTable}</b></div><div class="total" style="margin-top:8px"><span>應收</span><span>${money(total)}</span></div></div>
  ${isRes?`<div class="opt-group"><h3>取餐／配送方式</h3><div class="opts"><button class="opt selected" data-group="service" onclick="choose(this);toggleAddress()">來店自取</button><button class="opt" data-group="service" onclick="choose(this);toggleAddress()">外送</button></div></div>
  <div class="form-grid"><div class="field"><label>客人稱呼（可選）</label><input id="customerName"></div><div class="field"><label>聯絡電話</label><input id="phone" inputmode="tel"></div><div class="field"><label>預計取餐／配送時間</label><input id="pickupTime" type="datetime-local"></div><div class="field" id="addressField" style="display:none"><label>外送地址</label><input id="address"></div></div>
  <div class="opt-group"><h3>其他需求</h3><div class="opts"><button class="opt selected" data-group="receipt" onclick="choose(this)">不需要收據</button><button class="opt" data-group="receipt" onclick="choose(this)">需要收據</button><button class="opt selected" data-group="utensils" onclick="choose(this)">需要餐具</button><button class="opt" data-group="utensils" onclick="choose(this)">不需要餐具</button></div></div>`:''}
  <div class="opt-group"><h3>付款方式</h3><div class="opts">${['現金','LINE Pay','全支付'].map((x,i)=>`<button class="opt ${i===0?'selected':''}" data-group="pay" onclick="choose(this)">${x}</button>`).join('')}</div></div>
  <div class="modal-actions"><button class="secondary" onclick="closeModal()">返回</button><button class="primary" onclick="finishCheckout(${isRes})">${isRes?'確認並儲存預訂':'收款完成・送入待製作'}</button></div>`;
  document.getElementById('overlay').style.display='flex';
  if(isRes){
    const d=new Date(Date.now()+60*60000);
    document.getElementById('pickupTime').value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  }
}
function finishCheckout(isRes){
  let total=orderTotal(),pay=selected('pay')||'現金';
  if(isRes){
    const service=selected('service')||'來店自取', phone=document.getElementById('phone').value.trim(), pickup=document.getElementById('pickupTime').value;
    if(!phone){alert('預訂單請留下聯絡電話');return}
    if(!pickup){alert('請填預計時間');return}
    const address=(document.getElementById('address')?.value||'').trim();
    if(service==='外送'&&!address){alert('外送請填地址');return}
    sales.push({id:Date.now(),date:new Date().toISOString(),table:currentTable,orderNo:currentTable,total,pay,status:'預訂',
      serviceType:service,customerName:document.getElementById('customerName').value.trim(),phone,address,
      pickupTs:new Date(pickup).getTime(),receipt:selected('receipt')||'不需要收據',utensils:selected('utensils')||'需要餐具',
      items:JSON.parse(JSON.stringify(tables[currentTable]))});
    nextOrderNo++;tables[currentTable]=[];save();closeModal();renderOrder();showPage('orders');return;
  }
  sales.push({id:Date.now(),date:new Date().toISOString(),table:currentTable,orderNo:currentTable,total,pay,status:'待製作',readyAt:Date.now(),serviceType:'現場外帶',items:JSON.parse(JSON.stringify(tables[currentTable]))});
  if(currentTable.startsWith('外帶#'))nextOrderNo++;
  tables[currentTable]=[];save();closeModal();renderOrder();showPage('orders');
}
function todaySales(){let d=new Date().toDateString();return sales.filter(s=>new Date(s.date).toDateString()===d)}
function monthSales(){let d=new Date();return sales.filter(s=>{let x=new Date(s.date);return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()})}
function renderDashboard(){let td=todaySales(),mo=monthSales(),sum=a=>a.reduce((s,x)=>s+x.total,0);let pending=td.filter(x=>x.status==='待製作'||x.status==='製作中');let counts={};td.forEach(s=>s.items.forEach(x=>{let k=x.baseId||x.id;counts[x.name]=(counts[x.name]||0)+x.qty}));let top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);let pays={};td.forEach(s=>pays[s.pay]=(pays[s.pay]||0)+s.total);document.getElementById('content').innerHTML=`<div class="section-title"><h2>營收報表</h2><span class="pill">${new Date().toLocaleDateString('zh-TW')}</span></div><div class="dashboard"><div class="stat"><small>今日營收</small><b>${money(sum(td))}</b></div><div class="stat"><small>今日訂單</small><b>${td.length}</b></div><div class="stat"><small>平均客單</small><b>${money(td.length?sum(td)/td.length:0)}</b></div><div class="stat"><small>本月營收</small><b>${money(sum(mo))}</b></div><div class="stat"><small>本月訂單</small><b>${mo.length}</b></div><div class="stat"><small>目前未結帳桌</small><b>${Object.values(tables).filter(x=>x.length).length}</b></div></div><div class="report-box"><h3>待製作訂單 <span class="pill">${pending.length} 筆</span></h3>${pending.length?pending.slice().reverse().map(s=>`<div class="row"><span><b>${s.orderNo||s.table}</b><br><small class="hint">${s.items.map(x=>x.name+' ×'+x.qty).join('、')}</small></span><button class="secondary" onclick="markDone(${s.id})">完成</button></div>`).join(''):'<div class="hint">目前沒有待製作訂單</div>'}</div><div class="report-box"><h3>今日付款方式</h3>${Object.entries(pays).length?Object.entries(pays).map(([k,v])=>`<div class="row"><span>${k}</span><b>${money(v)}</b></div>`).join(''):'<div class="hint">尚無今日結帳資料</div>'}</div><div class="report-box"><h3>今日熱賣商品</h3>${top.length?top.map(([k,v],i)=>`<div class="row"><span>${i+1}. ${k}</span><b>${v}</b></div>`).join(''):'<div class="hint">尚無今日結帳資料</div>'}</div><div class="report-box"><button class="secondary" onclick="exportCSV()">匯出交易 CSV</button> <button class="secondary" onclick="demoData()">加入測試交易</button></div>`}
function renderAdmin(){let cats=['鍋類','套餐','鍋底加料','火鍋料','主食','飲料'];document.getElementById('content').innerHTML=`<div class="section-title"><h2>商品管理</h2><span class="pill">可修改售價</span></div><div class="admin-grid">${cats.map(cat=>`<div class="admin-card"><h3>${cat}</h3>${products.filter(p=>p.cat===cat).map(p=>`<div class="admin-row"><div>${p.name}<div class="tag">${p.config||''}</div></div><input type="number" value="${p.price}" onchange="changePrice('${p.id}',this.value)"><button class="secondary" onclick="toggleProduct('${p.id}')">${p.disabled?'啟用':'停用'}</button></div>`).join('')}</div>`).join('')}</div>`}
function changePrice(id,v){let p=products.find(x=>x.id===id);p.price=Number(v)||0;save()}
function toggleProduct(id){let p=products.find(x=>x.id===id);p.disabled=!p.disabled;save();renderAdmin()}
function markDone(id){let s=sales.find(x=>x.id===id);if(s){s.status='完成';s.completedAt=Date.now();save();if(document.getElementById('content')?.dataset.page==='orders')renderOrders();else renderDashboard()}}
function exportCSV(){let rows=[['訂單編號','日期','桌號','金額','付款方式','品項']];sales.forEach(s=>rows.push([s.id,new Date(s.date).toLocaleString('zh-TW'),s.table,s.total,s.pay,s.items.map(x=>`${x.name} x${x.qty}`).join('；')]));let csv='\\ufeff'+rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='三鼎紅_POS_交易紀錄.csv';a.click()}
function demoData(){let now=new Date().toISOString();sales.push({id:Date.now(),date:now,table:'A99',total:320,pay:'現金',items:[{name:'懷舊鍋',qty:2,price:80},{name:'鴨血 6塊',qty:2,price:25},{name:'古早味紅茶',qty:1,price:20},{name:'金針菇',qty:1,price:25}]});save();renderDashboard()}
showPage('menu');renderOrder();
</script>
</body></html>
